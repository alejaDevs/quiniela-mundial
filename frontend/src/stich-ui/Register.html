<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md antialiased">
<!-- Main Container - Split Layout on Desktop -->
<main class="w-full max-w-[1000px] flex flex-col md:flex-row bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] overflow-hidden border border-surface-dim">
<!-- Left Side: Visual/Branding (Hidden on mobile) -->
<div class="hidden md:flex md:w-1/2 bg-surface-variant relative overflow-hidden flex-col justify-between p-12">
<!-- Decorative Image -->
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="A sweeping, high-contrast photograph of a pristine professional soccer pitch illuminated by bright stadium lights. The vibrant green turf stretches towards the horizon, punctuated by stark white lines. The image exudes a professional, energetic, and celebratory atmosphere, characteristic of a global tournament setting. The clean, modern aesthetic aligns perfectly with a light-mode, minimalist design interface focused on sports analytics." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDgnQWjjIG5nItlwrGhajDGzvhGgBQFloCU9aRVSeAstmojW5vObXSnjl2cQS8KdFOZMJHM_ErSF3iwsvvVgRM1G0l_BSFcmMgi5UvVY6l18KMQNNmBciiScUE-H0aserybzjvgeWuc0T0zxO8zkQRypIRsPgeyUpflN_QpL5t3pP_bilts-mGzwNTzOHaxXU6pGZ_0OK5MUak08UeTSqdpv7_w-OwjjI2Yl9cNobWMl9m4KQNSnEAHdBqeHx-x7kggy0MQBXNHPHg');">
<!-- Gradient Overlay for readability if text is placed on top -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent"></div>
</div>
<div class="relative z-10">
<h1 class="font-display-lg text-display-lg text-on-primary">FIFA 2026</h1>
<p class="font-headline-md text-headline-md text-primary-fixed mt-2">Unete a la acción</p>
</div>
<div class="relative z-10 mt-auto">
<p class="font-body-md text-body-md text-on-primary max-w-sm">
                    Predice, compite y domina la tabla de clasificación mundial. Tu análisis profesional comienza aquí.
                </p>
</div>
</div>
<!-- Right Side: Registration Form -->
<div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-surface-container-lowest">
<!-- Mobile Header (Visible only on mobile) -->
<div class="md:hidden mb-8 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">FIFA 2026</h1>
</div>
<!-- Form Header -->
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Crear Cuenta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ingresa tus datos para registrarte en la plataforma.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Username Input -->
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-on-surface" for="username">Nombre de Usuario</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors" id="username" name="username" placeholder="tu_usuario" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-on-surface" for="password">Contraseña</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-3 px-4 bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" type="submit">
                    Registrarse
                </button>
</form>
<!-- Bottom Link -->
<div class="mt-8 text-center">
<a class="font-label-lg text-label-lg text-secondary hover:text-secondary-container transition-colors" href="#">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
</div>
</div>
